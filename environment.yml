name: ktc-vis
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  # ── Core Python ──────────────────────────────────────────────
  - python=3.10.13
  - pip

  # ── Dashboard & Visualization ────────────────────────────────
  - plotly=5.18.0
  - dash=2.14.2
  - matplotlib=3.8.2

  # ── Scientific Computing ─────────────────────────────────────
  - numpy=1.26.2
  - scipy=1.11.4
  - scikit-image=0.22.0
  - scikit-learn=1.3.2
  - h5py=3.10.0

  # ── PyTorch (CPU-safe default; override in Dockerfile for CUDA)
  - pytorch=2.0.1
  - torchvision=0.15.2
  - cpuonly          # Remove this line to enable CUDA in local builds

  # ── EIT Baseline ─────────────────────────────────────────────
  # pyEIT is pip-only:
  # - pyeit  (installed via pip below)

  # ── FEM / FEniCS for CUQI8 ───────────────────────────────────
  - fenics-dolfinx=0.7.2
  - petsc4py

  # ── Configuration ────────────────────────────────────────────
  - pyyaml=6.0.1

  # ── Testing ──────────────────────────────────────────────────
  - pytest=7.4.3
  - pytest-cov=4.1.0

  # ── Code Quality ─────────────────────────────────────────────
  - flake8=6.1.0

  # ── Jupyter ──────────────────────────────────────────────────
  - jupyterlab=4.0.9
  - nbstripout=0.6.1

  # ── pip-only packages ────────────────────────────────────────
  - pip:
    - pyeit==1.1.0
    - mat73==0.62             # MATLAB v7.3 .mat file reader
    - torch-geometric==2.4.0
    - deepinv==0.1.0
    - dash-bootstrap-components==1.5.0
    - tqdm==4.66.1
